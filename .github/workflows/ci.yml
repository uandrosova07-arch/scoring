name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Проверка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # requirements-train.txt: генератор и обучение. Без него тесты воспроизводимости обучения пропускаются.
      - run: pip install -r requirements-train.txt
      - run: pytest -q

  publish:
    name: Сборка образа и публикация в GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    env:
      # Если секрет не задан, шаг вызова деплоя пропускается, а образ всё равно публикуется.
      INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
      INFRA_REPO: ${{ vars.INFRA_REPO }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          # Модель по умолчанию из кода (app/model.py, DEFAULT_MODEL): образ получает тег с её версией, например
          # logreg-synthetic-0.1. Тег rules-0.3 остаётся на прежнем образе и больше не переставляется.
          MODEL=$(sed -n 's/^DEFAULT_MODEL = "\(.*\)"$/\1/p' app/model.py)
          test -n "$MODEL"
          echo "model=${MODEL}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.model }}
            ${{ steps.meta.outputs.image }}:latest

      # Передаём процессу деплоя из infra название компонента и версию образа.
      - name: Уведомить infra
        if: env.INFRA_DISPATCH_TOKEN != '' && env.INFRA_REPO != ''
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            -d "{\"event_type\":\"component-updated\",\"client_payload\":{\"component\":\"scoring\",\"image\":\"${{ steps.meta.outputs.image }}\",\"tag\":\"${{ github.sha }}\"}}"
